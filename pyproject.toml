[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jj-sensei"
version = "0.2.0"
description = "Version-matched Jujutsu documentation and agent-oriented repair tooling"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "Michael Morgan", email = "self@msmorgan.dev" },
]
keywords = ["jujutsu", "jj", "version-control", "agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.scripts]
jj-sensei = "jj_sensei.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
markers = [
  "contract: pins the shape of the installed jj's help; skips on any other jj version",
]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
